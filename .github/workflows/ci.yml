name: ci

# The repo's gates, per the foundation decision (spec #8, story 33): the Rust
# fmt/clippy/test lanes and the web lint/typecheck/test/build lane, alongside the
# packaging and sync-harness jobs in `packaging.yml`. These run on every push, so
# a red gate is visible before review rather than at merge.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
  # The release workflow runs this one as its gate, so "the full suite passed"
  # and "CI passed" can never mean two different things.
  workflow_call:

jobs:
  web:
    # Node-only: the frontend's own gates, with no Rust toolchain in sight.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install frontend dependencies
        run: npm --prefix frontend install
      - run: npm --prefix frontend run lint
      - run: npm --prefix frontend run typecheck
      - run: npm --prefix frontend run test
      - run: npm --prefix frontend run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `build.rs` refuses to embed an absent bundle, so every Rust lane needs
      # the frontend built first — including `cargo fmt`'s build-free check,
      # which shares the workspace.
      - name: Build the frontend bundle
        run: npm run build:frontend

      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      # The process-boundary suite launches the compiled binary; a throwaway
      # XDG cache keeps it off the runner's home directory either way.
      - run: cargo test

  release-checks:
    # The guards the release workflow puts in front of `publish` — a tag that
    # disagrees with the source version, a wheel that isn't the one the tag
    # names. Seconds, no toolchain, so they are gated on every change rather
    # than discovered at a release.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: scripts/release-checks.test.sh
