[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "uncompose-compare"
version = "0.1.0"
description = "Spike 2: a Vite/React stub embedded in a Rust binary, shipped as a maturin wheel and served over loopback."
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Private :: Do Not Upload",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Rust",
]

# maturin ships the compiled Rust binary (Cargo `[[bin]] uncompose-compare`) as a
# wheel script entry point — no Python code, no extension module. `bindings = "bin"`
# makes that explicit rather than relying on autodetection. The wheel carries only
# the binary (which already embeds `frontend/dist` via rust-embed), so pip installs
# on a machine with no Node or Rust toolchain (spec #1, story 2).
[tool.maturin]
bindings = "bin"
strip = true
